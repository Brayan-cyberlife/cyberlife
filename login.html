<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Cyber Life</title>
<!-- CORREGIDO: Se restauró el enlace correcto de googleapis para evitar errores de red -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- CORREGIDO: Inyección de número dinámico aleatorio para destruir por completo la caché de Render -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ range(1, 9999) | random }}">
</head>
<body class="auth-page">

<!-- AGREGADO: Elementos obligatorios para proyectar las líneas láser oblicuas del fondo -->
<div class="neon-line-1"></div>
<div class="neon-line-2"></div>
  
<!-- NUEVO: Las dos nuevas líneas de la derecha -->
<div class="neon-line-3"></div>
<div class="neon-line-4"></div>

<div class="auth-container">
  <!-- El resto de tu contenedor y formulario se queda exactamente igual -->

<!-- Contenedor principal que reescala la tarjeta al tamaño correcto -->
<div class="auth-container">
  
  <div class="auth-box">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Cyber Life">
      <span>CYBER LIFE</span>
    </div>
    
    <div class="auth-title">Ingresa a tu panel</div>
    <div class="auth-sub">Gestión de activos TI</div>

    <!-- Sección de mensajes Flash (Errores) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash flash-danger">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
      <div class="auth-field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      
      <div class="auth-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn auth-submit">Ingresar</button>
    </form>

    <div class="auth-foot">
      ¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a>
    </div>
  </div>

</div>

</body>
</html>
