<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Cyber Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .auth-box{width:100%;max-width:380px;padding:0 20px;}
  .auth-brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;}
  .auth-brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 14px var(--primary-dim);}
  .auth-brand span{font-family:var(--font-display);font-weight:700;font-size:17px;}
  .auth-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin-bottom:6px;text-align:center;}
  .auth-sub{color:var(--text-dim);font-size:13px;text-align:center;margin-bottom:26px;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
  .auth-field input{width:100%;}
  .auth-submit{width:100%;justify-content:center;margin-top:8px;}
  .auth-foot{text-align:center;margin-top:20px;font-size:13px;color:var(--text-dim);}
  .auth-foot a{color:var(--primary);}
</style>
</head>
<body>
<div class="auth-box">
  <div class="auth-brand">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Cyber Life">
    <span>CYBER LIFE</span>
  </div>
  <div class="auth-title">Ingresa a tu panel</div>
  <div class="auth-sub">Gestión de activos TI</div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post" class="panel">
    <div class="auth-field">
      <label>Correo</label>
      <input type="email" name="email" required autofocus placeholder="tu@empresa.com">
    </div>
    <div class="auth-field">
      <label>Contraseña</label>
      <input type="password" name="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn auth-submit">Ingresar</button>
  </form>

  <div class="auth-foot">
    ¿No tienes cuenta? <a href="{{ url_for('register') }}">Crea una gratis</a>
  </div>
</div>
</body>
</html>
