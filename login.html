<div class="network-vignette"></div>

<div class="auth-container">
  <div class="auth-box">
    <div class="auth-brand">
      <div class="auth-logo-wrap">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Cyber Life">
      </div>
    </div>

    <div class="auth-title">Inicia sesión</div>
    <div class="auth-sub">para continuar</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST" class="auth-form">
      <div class="auth-field">
        <label for="email">Correo electrónico</label>
        <div class="auth-input-wrap">
          <span class="auth-input-icon" aria-hidden="true">⌾</span>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="username">
        </div>
      </div>

      <div class="auth-field">
        <label for="password">Contraseña</label>
        <div class="auth-input-wrap">
          <span class="auth-input-icon" aria-hidden="true">⌑</span>
          <input type="password" id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar contraseña">◉</button>
        </div>
      </div>

      <button type="submit" class="btn auth-submit">
        <span>Ingresar</span><span class="auth-submit-arrow">→</span>
      </button>
    </form>

    <div class="auth-divider"><span>o</span></div>

    <div class="auth-foot">
      ¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a>
    </div>
  </div>
</div>

<script>
(function () {
  const toggle = document.getElementById("passwordToggle");
  const password = document.getElementById("password");
  if (!toggle || !password) return;
  toggle.addEventListener("click", function () {
    const hidden = password.type === "password";
    password.type = hidden ? "text" : "password";
    toggle.setAttribute("aria-label", hidden ? "Ocultar contraseña" : "Mostrar contraseña");
    toggle.textContent = hidden ? "◌" : "◉";
  });
})();
</script>
