<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Cyber Life</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<!-- 1. Asegúrate de incluir la clase 'auth-page' en el body para activar el neón -->
<body class="auth-page">

<!-- 2. AGREGADO: Este contenedor centra la tarjeta y le da la escala correcta en pantalla -->
<div class="auth-container">
  
  <div class="auth-box">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Cyber Life">
      <span>CYBER LIFE</span>
    </div>
    
    <div class="auth-title">Ingresa a tu panel</div>
    <div class="auth-sub">Gestión de activos TI</div>

    <!-- Sección de mensajes Flash (Errores) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <!-- Cambiado a flash-danger automáticamente para combinar con tu CSS de borde rojo -->
            <div class="flash flash-danger">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
      <div class="auth-field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      
      <div class="auth-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <!-- Usando tu botón verde nativo .btn -->
      <button type="submit" class="btn auth-submit">Ingresar</button>
    </form>

    <div class="auth-foot">
      ¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a>
    </div>
  </div>

</div> <!-- Fin de auth-container -->

</body>
</html>
